# NetBeans Java SE project configuration
# This file lets NetBeans open the repository via File > Open Project.

build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
src.dir=src
test.src.dir=test

build.dir=build
build.classes.dir=${build.dir}/classes
build.generated.dir=${build.dir}/generated
build.test.classes.dir=${build.dir}/test/classes

dist.dir=dist
dist.jar=${dist.dir}/TripPlanner.jar

main.class=tripplanner.ui.MainDashboard
application.title=Trip Planner
application.vendor=TripPlanner

javac.source=1.8
javac.target=1.8
javac.encoding=UTF-8

# Dependencies are referenced from the local Maven cache.
# If these paths are marked as missing in NetBeans, run `mvn compile` once
# or use the Maven project support to download dependencies.
file.reference.flatlaf=${user.home}/.m2/repository/com/formdev/flatlaf/3.4.1/flatlaf-3.4.1.jar
file.reference.gson=${user.home}/.m2/repository/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar

javac.classpath=${file.reference.flatlaf}:${file.reference.gson}
run.classpath=${build.classes.dir}:${javac.classpath}

# Common NetBeans Java SE properties
build.sysclasspath=ignore
debug.classpath=${run.classpath}
debug.test.classpath=${run.classpath}
endorsed.classpath=
excludes=
includes=**
jar.compress=false
javac.compilerargs=
javac.deprecation=false
javac.processorpath=${javac.classpath}
javac.test.classpath=${javac.classpath}:${build.classes.dir}
javadoc.additionalparam=
javadoc.author=false
javadoc.encoding=${javac.encoding}
javadoc.noindex=false
javadoc.nonavbar=false
javadoc.notree=false
javadoc.private=false
javadoc.splitindex=true
javadoc.use=true
javadoc.version=false
platform.active=default_platform
run.jvmargs=
